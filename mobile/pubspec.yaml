name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8        # ← must be at this indent level

  # State Management & Routing
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^12.1.1
  
  # Database
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0

  # Networking & Real-time
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0
  web_socket_channel: ^2.4.0

  # Location & Permissions
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Sensors & Hardware
  flutter_blue_plus: ^1.31.9
  sensors_plus: ^6.0.1
  health: ^13.0.0

  # Audio & Media
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  record: ^6.2.0
  image_picker: ^1.0.7

  # Core Styling & UX
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.3.1
  glass_kit: ^3.0.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_secure_storage: ^10.0.0
  workmanager: ^0.9.0
  vibration: ^2.0.1
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2
  path_provider: ^2.1.2
  fl_chart: ^1.2.0
  connectivity_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - .env

dependency_overrides:
  record_linux: ^1.3.0  