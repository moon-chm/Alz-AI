name: alz_ai
description: "ALZ-AI Patient & Caretaker Premium Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Networking & API
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  
  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # UI Enhancement (Phase 6)
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Functional Programming
  fpdart: ^1.2.0
  
  # Storage & Persistence
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.1.1

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Media & Voice (Phase 2 Additions)
  flutter_tts: ^4.2.2
  record: ^6.2.0
  path_provider: ^2.1.5
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  timeago: ^3.7.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1
  sensors_plus: ^7.0.0
  workmanager: ^0.9.0+3
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Generation
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.15
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  
  # Production (Phase 6)
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

  # Linting
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 26

flutter_native_splash:
  color: "#1A237E" # AppTheme.primaryColor
  image: assets/images/app_icon.png
  android_12:
    image: assets/images/app_icon.png
    color: "#1A237E"
  fullscreen: true
